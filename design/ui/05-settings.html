<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目泊位 · 声音与时段</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1440px; height: 1000px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; color: #30342f; }
    button { font: inherit; cursor: default; }
    .board { position: relative; width: 1440px; height: 1000px; background: #f1f0ed; }
    .page-head { position: absolute; top: 39px; left: 64px; right: 64px; display: flex; align-items: flex-end; justify-content: space-between; }
    .eyebrow { margin: 0 0 12px; color: #81867f; font-size: 11px; letter-spacing: 2.2px; font-weight: 650; }
    .page-title { margin: 0; font-size: 32px; line-height: 1.3; letter-spacing: -1.1px; font-weight: 570; }
    .page-intro { margin: 0 0 5px; color: #858b83; font-size: 14px; }
    .window { position: absolute; top: 176px; left: 190px; width: 1060px; height: 720px; display: flex; overflow: hidden; border-radius: 14px; border: 1px solid #ffffff26; background: #1b1d1f; box-shadow: 0 25px 65px #2f35351c, 0 3px 13px #2f353518, 0 0 0 1px #11191f60; color: #e4e6e7; font-size: 14px; }
    .sidebar { flex: 0 0 200px; background: linear-gradient(140deg, #25292a, #242829); border-right: 1px solid #101314; }
    .traffic-lights { display: flex; gap: 8px; height: 48px; padding: 19px 0 0 20px; }
    .traffic-lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px #00000018; background: #fa615a; }
    .traffic-lights i:nth-child(2) { background: #f7be4f; }
    .traffic-lights i:nth-child(3) { background: #36c84c; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 14px 17px 27px; }
    .brand :is(img,.codex-mascot) { width: 43px; height: 43px; object-fit: contain; }
    .brand-name { margin: 0 0 4px; font-size: 16px; font-weight: 570; color: #e9e9e4; }
    .brand-caption { color: #858c8b; font-size: 12px; letter-spacing: .2px; }
    .navigation { padding: 0 10px; display: flex; flex-direction: column; gap: 5px; }
    .nav-item { width: 100%; min-height: 39px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; border-radius: 7px; color: #b1b7b5; font-size: 14px; background: transparent; text-align: left; }
    .nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; color: #8e9996; }
    .nav-item.selected { color: #e2ece7; background: #4c665752; border-color: #7f9f8a15; box-shadow: inset 0 1px 0 #ffffff03; }
    .nav-item.selected svg { color: #a8c9ba; }
    .sidebar-bottom { position: absolute; bottom: 24px; left: 21px; display: flex; align-items: center; gap: 7px; color: #78827f; font-size: 12px; }
    .sidebar-bottom i { width: 5px; height: 5px; border-radius: 50%; background: #719b88; }
    .content { flex: 1; min-width: 0; padding: 27px 34px 0; }
    .settings-header { height: 65px; display: flex; justify-content: space-between; align-items: flex-start; }
    .settings-title { margin: 0; font-size: 20px; line-height: 26px; font-weight: 590; letter-spacing: -.5px; }
    .settings-subtitle { margin: 7px 0 0; font-size: 13px; color: #858c8d; }
    .pause-button { height: 32px; margin-top: 2px; display: flex; align-items: center; gap: 7px; border: 1px solid #424749; border-radius: 6px; padding: 0 12px; color: #bec5c4; font-size: 13px; background: linear-gradient(#323739, #2c3132); box-shadow: 0 1px 2px #0002; }
    .pause-button svg { width: 13px; height: 13px; }
    .section-heading { height: 27px; margin: 0; display: flex; align-items: center; font-size: 13px; font-weight: 550; color: #8e9894; }
    .section-heading .subheading { font-weight: 400; margin-left: auto; color: #666e6c; }
    .row { min-height: 36px; border-bottom: 1px solid #ffffff08; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .row:last-child { border-bottom: none; }
    .row-label { color: #d9dddd; font-size: 14px; line-height: 20px; }
    .row-description { margin-top: 2px; font-size: 13px; color: #7d8783; line-height: 18px; }
    .toggle { width: 32px; height: 19px; border: 0; border-radius: 12px; position: relative; flex: 0 0 32px; padding: 0; background: #454b4c; box-shadow: inset 0 0 0 1px #ffffff08; }
    .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #d0d4d2; box-shadow: 0 1px 2px #0005; }
    .toggle.on { background: #89b69e; }
    .toggle.on::after { left: 15px; background: #f3f7f3; }
    .select { height: 26px; min-width: 172px; display: flex; align-items: center; justify-content: space-between; gap: 26px; padding: 0 8px 0 10px; border-radius: 5px; border: 1px solid #42494a; background: linear-gradient(#353b3c, #303637); color: #dce1de; font-size: 13px; box-shadow: 0 1px 2px #0002; }
    .select svg { width: 11px; height: 13px; color: #a6b0ad; }
    .voice-section .row:nth-child(2) { height: 44px; }
    .voice-section .row:nth-child(5) { height: 39px; }
    .volume-control { display: flex; align-items: center; gap: 12px; }
    .volume-control svg { width: 14px; height: 14px; color: #7b8782; }
    .volume-track { width: 172px; height: 4px; border-radius: 3px; background: #424a46; position: relative; }
    .volume-track::before { content: ""; position: absolute; width: 65%; height: 4px; background: #99b9a7; border-radius: 3px; }
    .volume-track::after { content: ""; position: absolute; left: calc(65% - 7px); top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #e4e9e4; box-shadow: 0 1px 3px #0005; }
    .volume-value { font-size: 13px; color: #9fa9a4; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .trial-row { min-height: 44px; border-bottom: 0; }
    .trial-text { color: #8c9691; font-size: 13px; }
    .trial-button { height: 27px; min-width: 73px; display: flex; justify-content: center; align-items: center; gap: 7px; background: #303738; border: 1px solid #454d4c; border-radius: 5px; color: #d5dfd8; font-size: 13px; }
    .trial-button svg { width: 10px; height: 10px; }
    .events-section { margin-top: 9px; border-top: 1px solid #ffffff0b; padding-top: 9px; }
    .events-section .row { min-height: 32px; }
    .dnd-section { margin-top: 10px; padding-top: 9px; border-top: 1px solid #ffffff0b; }
    .dnd-row { height: 37px; border: 0; }
    .time-control { margin-left: auto; display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; color: #777f7c; font-size: 13px; }
    .time { width: 62px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #393f3d; background: #262b29; color: #909b95; }
    .dnd-note { margin: 1px 0 0; font-size: 13px; color: #7e8983; line-height: 19px; }
    .privacy { display: flex; align-items: center; gap: 7px; margin: 20px 0 0; color: #727e77; font-size: 13px; }
    .privacy svg { width: 13px; height: 13px; flex: 0 0 13px; }
    .page-foot { position: absolute; left: 64px; right: 64px; top: 939px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8b9188; }
    .specs { display: flex; align-items: center; gap: 23px; }
    .specs span + span::before { content: "·"; margin-right: 23px; color: #b0b6ad; }
    .footer-name { font-size: 11px; letter-spacing: 1.3px; }
  .page-foot,.page-foot span,.foot-brand{color:#626e65!important}</style>
</head>
<body>
  <main class="board">
    <header class="page-head"><div><p class="eyebrow">05 / SOUND &amp; TIMING</p><h1 class="page-title">声音有分寸，提醒有重点</h1></div><p class="page-intro">项目泊位 · 声音与时段</p></header>
    <section class="window" aria-label="项目泊位设置窗口">
      <aside class="sidebar">
        <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="brand"><img src="../assets/toy-attention.svg" alt="团团，项目泊位的小伙伴"><div><p class="brand-name">项目泊位</p><div class="brand-caption">每件事，都有着落</div></div></div>
        <nav class="navigation" aria-label="设置分类">
          <button type="button" class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="3"/><path d="M7.5 4v12m5-12v12"/></svg>项目泊位</button>
          <button type="button" class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5a5 5 0 0 0-5 5v3l-1.5 3h13l-1.5-3v-3a5 5 0 0 0-5-5ZM8 16.5h4"/></svg>提醒事件</button>
          <button type="button" class="nav-item selected" aria-current="page"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 5 7H2.5v6H5l4 3V4Z"/><path d="M12 6.5a5 5 0 0 1 0 7M14.5 4a8.5 8.5 0 0 1 0 12"/></svg>声音与时段</button>
          <button type="button" class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="11" rx="2"/><path d="M10 14.5v3m-3 0h6"/></svg>显示与位置</button>
          <button type="button" class="nav-item"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m8 12 4-4M7.5 6.5l2-2a4.2 4.2 0 0 1 6 6l-2 2M12.5 13.5l-2 2a4.2 4.2 0 0 1-6-6l2-2"/></svg>会话连接</button>
        </nav>
        <div class="sidebar-bottom"><i></i>与你的工作保持同步</div>
      </aside>
      <div class="content">
        <header class="settings-header"><div><h2 class="settings-title">声音与时段</h2><p class="settings-subtitle">只在需要你的时候，轻轻提醒。</p></div><button class="pause-button" type="button"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="3" y="2.5" width="2.5" height="9" rx=".8"/><rect x="8.5" y="2.5" width="2.5" height="9" rx=".8"/></svg>语音暂停</button></header>
        <section class="voice-section" aria-labelledby="voice-title">
          <h3 class="section-heading" id="voice-title">语音播报</h3>
          <div class="row"><div><div class="row-label">系统语音</div></div><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="系统语音已开启"></button></div>
          <div class="row"><span class="row-label">音色</span><button class="select" type="button" aria-label="音色 Tingting 中文">Tingting · 中文<svg viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 3-3 3 3M3 9l3 3 3-3"/></svg></button></div>
          <div class="row"><span class="row-label">语速</span><button class="select" type="button" aria-label="语速正常">正常<svg viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 3-3 3 3M3 9l3 3 3-3"/></svg></button></div>
          <div class="row"><span class="row-label">音量</span><div class="volume-control"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4.5 6H2v4h2.5L8 13V3Zm3 2a4.5 4.5 0 0 1 0 6"/></svg><div class="volume-track" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65"></div><span class="volume-value">65%</span></div></div>
          <div class="row"><span class="row-label">播报项目名</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="播报项目名已开启"></button></div>
          <div class="row trial-row"><span class="trial-text">“API 服务需要你确认。”</span><button type="button" class="trial-button"><svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.5 10 6l-7 4.5Z"/></svg>试听</button></div>
        </section>
        <section class="events-section" aria-labelledby="events-title">
          <h3 class="section-heading" id="events-title">播报哪些事件<span class="subheading">按需开启</span></h3>
          <div class="row"><span class="row-label">需要审批</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="需要审批播报已开启"></button></div>
          <div class="row"><span class="row-label">需要回答</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="需要回答播报已开启"></button></div>
          <div class="row"><span class="row-label">本轮结束</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="本轮结束播报已开启"></button></div>
          <div class="row"><span class="row-label">运行终止</span><button class="toggle on" type="button" role="switch" aria-checked="true" aria-label="运行终止播报已开启"></button></div>
          <div class="row"><span class="row-label">子任务结束</span><button class="toggle" type="button" role="switch" aria-checked="false" aria-label="子任务结束播报已关闭"></button></div>
        </section>
        <section class="dnd-section" aria-labelledby="dnd-title">
          <h3 class="section-heading" id="dnd-title">安静时段</h3>
          <div class="row dnd-row"><span class="row-label">勿扰时段</span><div class="time-control" aria-label="勿扰时段 23点到次日8点"><span class="time">23:00</span><span>–</span><span class="time">08:00</span></div><button class="toggle" type="button" role="switch" aria-checked="false" aria-label="勿扰时段已关闭"></button></div>
          <p class="dnd-note">开启后，此时段内暂停语音，待办仍会显示。</p>
        </section>
        <p class="privacy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7"/></svg>仅播报项目名与状态，不朗读会话内容。</p>
      </div>
    </section>
    <footer class="page-foot"><div class="specs"><span>macOS 系统语音</span><span>事件按需播报</span><span>安静时段保留待办</span></div><span class="footer-name">项目泊位 / SETTINGS</span></footer>
  </main>
<script src="../assets/mascot-art.js"></script><script src="../assets/mascot-motion.js"></script></body>
</html>
